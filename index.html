    <style>
        @font-face { font-family: 'Traditional Arabic'; src: local('Traditional Arabic'), local('Scheherazade New'), local('Amiri'); }
        .font-quran-display { font-family: 'Traditional Arabic', 'Scheherazade New', 'Amiri', serif; }
        .status-retained { background-color: #006875 !important; color: #ffffff !important; }
        .status-consolidation { background-color: #549ba6 !important; color: #ffffff !important; }
        .status-review { background-color: #f3bf26 !important; color: #251a00 !important; }
        .status-danger { background-color: #ba1a1a !important; color: #ffffff !important; }
        .heatmap-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(28px, 1fr)); gap: 5px; }
        .ayah-cell { aspect-ratio: 1; border-radius: 3px; transition: all 0.2s ease; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 11px; font-family: 'JetBrains Mono', monospace; font-weight: 700; }
        .ayah-cell:hover { transform: scale(1.25); z-index: 20; box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2); }
        .glass-panel-dark { background: #2b3233; border: 1px solid rgba(186, 201, 204, 0.15); }
        .gauge-circle { stroke-dasharray: 283; stroke-dashoffset: 283; transition: stroke-dashoffset 1.2s cubic-bezier(0.4, 0, 0.2, 1); }
        .view-panel { display: none; }
        .view-panel.active { display: block; }
        body.ltr-mode { direction: ltr; }
        body.ltr-mode #sideNavBar { left: 0; right: auto; border-right: 1px solid rgba(186, 201, 204, 0.3); border-left: none; }
        body.ltr-mode main { margin-left: 280px; margin-right: 0; }
        @media (max-width: 1024px) { body.ltr-mode main, main { margin-left: 0 !important; margin-right: 0 !important; } }
