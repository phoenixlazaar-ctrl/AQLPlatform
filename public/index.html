<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="منصة AQL للتعليم التكيفي للقرآن الكريم">
    <title>AQL — منصة التعليم التكيفي للقرآن الكريم</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #071a17;
        color: #f6f0dc;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 2rem;
        background:
          radial-gradient(circle at top, rgba(45, 155, 125, 0.3), transparent 42%),
          #071a17;
      }

      main {
        width: min(44rem, 100%);
        padding: clamp(2rem, 6vw, 4.5rem);
        border: 1px solid rgba(235, 205, 132, 0.35);
        border-radius: 1.5rem;
        text-align: center;
        background: rgba(7, 26, 23, 0.82);
        box-shadow: 0 1.5rem 5rem rgba(0, 0, 0, 0.35);
      }

      .eyebrow {
        margin: 0 0 1rem;
        color: #e8c979;
        font-weight: 700;
        letter-spacing: 0.12em;
      }

      h1 {
        margin: 0;
        font-size: clamp(2.4rem, 9vw, 5.5rem);
        line-height: 1;
      }

      p {
        margin: 1.5rem auto 0;
        max-width: 34rem;
        color: #d8dfd9;
        font-size: clamp(1rem, 3vw, 1.2rem);
        line-height: 1.9;
      }

      .status {
        display: inline-flex;
        align-items: center;
        gap: 0.6rem;
        margin-top: 2rem;
        padding: 0.65rem 1rem;
        border-radius: 999px;
        color: #bcebd7;
        background: rgba(45, 155, 125, 0.16);
      }

      .status::before {
        width: 0.55rem;
        height: 0.55rem;
        border-radius: 50%;
        background: #67d5aa;
        content: "";
        box-shadow: 0 0 1rem #67d5aa;
      }
    </style>
  </head>
  <body>
    <main>
      <p class="eyebrow">ADAPTIVE QURAN LEARNING</p>
      <h1>AQL</h1>
      <p>منصة تعليمية تكيفية تهدف إلى التشخيص والتخصيص والتحقق من التعلّم في رحلة حفظ القرآن الكريم.</p>
      <div class="status">المنصة قيد الإعداد</div>
    </main>
  </body>
</html>
